<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="theme-color" content="#075E54"/>
<title>WA Excel Sender (Manual)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;color:#111b21;padding-bottom:4rem}
.header{background:#075E54;color:#fff;padding:.9rem 1.2rem;font-size:17px;font-weight:700;position:sticky;top:0;z-index:9}
.main{max-width:680px;margin:0 auto;padding:1rem}
.box{background:#fff;border-radius:12px;padding:1rem;margin-bottom:1rem;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.upload{border:2px dashed #c0c8d0;text-align:center;cursor:pointer}
.upload b{display:block;margin:.3rem 0}
label{font-size:12px;font-weight:700;color:#667781;display:block;margin:.6rem 0 .25rem}
input[type=text],select,input[type=tel]{width:100%;padding:10px;border:1.5px solid #dde1e7;border-radius:8px;font-size:14px;background:#fafafa}
.big{width:100%;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;margin-top:.7rem}
.green{background:#25D366;color:#fff}
.dark{background:#075E54;color:#fff}
.light{background:#fff;color:#075E54;border:1.5px solid #128C7E}
.top{display:flex;align-items:center;gap:10px;margin-bottom:.7rem}
.num{flex:1;font-weight:700}
.num small{display:block;font-weight:400;color:#667781;font-size:11px}
.pill{font-size:11px;background:#e9fef0;color:#075E54;padding:2px 9px;border-radius:999px;font-weight:600}
.done{background:#d9f7e4;color:#0a7a3a}
.imgbox{background:#efeae2;padding:.7rem;border-radius:10px;overflow-x:auto}
.imgbox canvas{max-width:100%;border-radius:8px;display:block;margin:auto}
.card.sent{opacity:.55}
.err{background:#fde8e8;color:#c0392b;padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:1rem}
.count{text-align:center;font-size:13px;color:#667781;margin-bottom:.8rem}
</style>
</head>
<body>
<div class="header">WA Excel Sender (Manual)</div>
<div class="main">

  <div class="box upload" onclick="document.getElementById('f').click()">
    <div style="font-size:32px">📊</div>
    <b>Excel file select karo</b>
    <span style="font-size:12px;color:#667781">.xlsx / .xls / .csv</span>
    <div id="fname"></div>
    <input type="file" id="f" accept=".xlsx,.xls,.csv" style="display:none"/>
  </div>

  <div class="box" id="settings" style="display:none">
    <label>Footer line</label>
    <input type="text" id="footer" value="Onmove//Zast//Transin Pod courier kijiye jaldi"/>
    <label>Mobile number column</label>
    <select id="mcol"></select>
    <label>Image style</label>
    <select id="theme">
      <option value="green">WhatsApp Green</option>
      <option value="blue">Blue</option>
      <option value="dark">Dark</option>
    </select>
    <button class="big dark" onclick="build()">Images Banao</button>
  </div>

  <div id="err"></div>

  <div id="out" style="display:none">
    <div class="count" id="count"></div>
    <input type="tel" id="search" placeholder="Number search karo..." oninput="search(this.value)" style="margin-bottom:1rem"/>
    <div id="cards"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const THEMES={
  green:{bg:'#fff',tit:'#075E54',titT:'#fff',h:'#128C7E',hT:'#fff',r1:'#fff',r2:'#f7fdf9',c:'#111b21',b:'#c8e6c9',fb:'#dcf8c6',ft:'#075E54'},
  dark:{bg:'#1f2c34',tit:'#111b21',titT:'#e9edef',h:'#2a3942',hT:'#e9edef',r1:'#1f2c34',r2:'#182028',c:'#e9edef',b:'#3b4a54',fb:'#111b21',ft:'#00a884'},
  blue:{bg:'#fff',tit:'#0d47a1',titT:'#fff',h:'#1565c0',hT:'#fff',r1:'#fff',r2:'#f0f6ff',c:'#0a1929',b:'#bbdefb',fb:'#e3f2fd',ft:'#0d47a1'}
};
let rows=[],hdrs=[],dateCols=new Set(),items=[];

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function fmt(d){return String(d.getUTCDate()).padStart(2,'0')+'-'+MONTHS[d.getUTCMonth()]+'-'+String(d.getUTCFullYear()).slice(-2)}
function toDate(v){
  if(!v&&v!==0)return'';
  if(typeof v==='string'){const d=new Date(v);return isNaN(d)?v:fmt(d);}
  if(typeof v==='number'&&v>40000&&v<60000)return fmt(new Date(Math.round((v-25569)*864e5)));
  return v;
}
function isDateCol(h,vals){return/date|dt|day/i.test(h)||vals.filter(v=>typeof v==='number'&&v>40000&&v<60000).length>vals.length*.5}
function cleanNum(raw){let n=String(raw).replace(/[\s\-\(\)\+\.]/g,'');if(n.startsWith('0'))n='91'+n.slice(1);if(n.length===10)n='91'+n;return n.replace(/\D/g,'')}
const cell=(r,i)=>dateCols.has(i)?toDate(r[i]):(r[i]??'');
function showErr(m){$('err').innerHTML='<div class="err">'+esc(m)+'</div>'}

/* ── file load ── */
$('f').addEventListener('change',e=>{
  const file=e.target.files[0];if(!file)return;
  $('fname').innerHTML='<div class="pill" style="display:inline-block;margin-top:.5rem">📄 '+esc(file.name)+'</div>';
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:'binary'});
      const json=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:true});
      if(json.length<2){showErr('Data nahi mila.');return;}
      hdrs=json[0].map(h=>String(h).trim());
      rows=json.slice(1).filter(r=>r.some(c=>c!==''));
      dateCols=new Set();
      hdrs.forEach((h,i)=>{if(isDateCol(h,rows.map(r=>r[i])))dateCols.add(i)});
      $('mcol').innerHTML=hdrs.map((h,i)=>`<option value="${i}">${String.fromCharCode(65+i)} — ${esc(h||'Col '+(i+1))}</option>`).join('');
      const ai=hdrs.findIndex(h=>/mob|phone|contact|whatsapp/i.test(h));
      $('mcol').value=ai>=0?ai:Math.min(6,hdrs.length-1);
      $('settings').style.display='block';$('out').style.display='none';$('err').innerHTML='';
    }catch(err){showErr('File error: '+err.message)}
  };
  r.readAsBinaryString(file);
});

/* ── draw table image ── */
function draw(data,mci,phone,footer,theme){
  const T=THEMES[theme],cols=hdrs.map((_,i)=>i).filter(i=>i!==mci);
  const D=2,F='Arial',P=14,RH=36,HH=42,TH=46,FH=52;
  const t=document.createElement('canvas').getContext('2d');
  const cw=cols.map(ci=>{
    t.font=`bold 12px ${F}`;let w=t.measureText(hdrs[ci]).width+P*2;
    t.font=`12px ${F}`;data.forEach(r=>{w=Math.max(w,t.measureText(String(cell(r,ci)).slice(0,22)).width+P*2)});
    return Math.max(w,80);
  });
  const W=Math.max(cw.reduce((a,b)=>a+b,0),460),H=TH+HH+data.length*RH+FH;
  const cv=document.createElement('canvas');
  cv.width=W*D;cv.height=H*D;cv.style.width=W+'px';cv.style.height=H+'px';
  const x=cv.getContext('2d');x.scale(D,D);
  x.fillStyle=T.bg;x.fillRect(0,0,W,H);
  x.fillStyle=T.tit;x.fillRect(0,0,W,TH);
  x.fillStyle=T.titT;x.font=`bold 14px ${F}`;x.fillText('Orders — '+phone,P,TH/2+5);
  x.fillStyle=T.h;x.fillRect(0,TH,W,HH);
  let px=0;
  cols.forEach((ci,i)=>{x.fillStyle=T.hT;x.font=`bold 12px ${F}`;x.fillText(hdrs[ci],px+P,TH+HH/2+5);px+=cw[i]});
  data.forEach((r,ri)=>{
    const y=TH+HH+ri*RH;
    x.fillStyle=ri%2?T.r2:T.r1;x.fillRect(0,y,W,RH);
    x.strokeStyle=T.b;x.lineWidth=.5;x.beginPath();x.moveTo(0,y+RH);x.lineTo(W,y+RH);x.stroke();
    px=0;
    cols.forEach((ci,i)=>{x.fillStyle=T.c;x.font=`12px ${F}`;x.fillText(String(cell(r,ci)).slice(0,22),px+P,y+RH/2+5);px+=cw[i]});
  });
  const fy=TH+HH+data.length*RH;
  x.fillStyle=T.fb;x.fillRect(0,fy,W,FH);
  if(footer){x.fillStyle=T.ft;x.font=`bold 18px ${F}`;x.textAlign='center';x.fillText(footer,W/2,fy+FH/2+7);x.textAlign='left'}
  x.strokeStyle=T.b;x.strokeRect(.5,.5,W-1,H-1);
  return cv;
}

const toBlob=cv=>new Promise(r=>cv.toBlob(r,'image/png'));
function markDone(i){
  const it=items[i];it.card.classList.add('sent');
  it.pill.textContent='✓ Ho gaya';it.pill.classList.add('done');
  const n=items.filter(x=>x.card.classList.contains('sent')).length;
  $('count').textContent=`${n} / ${items.length} ho gaye`;
}

/* Button 1: image share (mobile) ya download (PC) */
async function shareImg(i){
  const {cv,num}=items[i];
  const blob=await toBlob(cv);
  const file=new File([blob],num+'_orders.png',{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]});markDone(i);return}catch(e){if(e.name==='AbortError')return}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=num+'_orders.png';a.click();
  markDone(i);
}
/* Button 2: us number ki chat kholo */
function openChat(i){window.open('https://wa.me/'+items[i].num,'_blank')}

/* ── build cards ── */
function build(){
  const mci=+$('mcol').value,theme=$('theme').value,footer=$('footer').value.trim();
  const groups={};
  rows.forEach(r=>{
    const raw=r[mci];if(!raw&&raw!==0)return;
    const p=cleanNum(raw);if(p.length<10)return;
    (groups[p]=groups[p]||{raw,rows:[]}).rows.push(r);
  });
  const list=Object.entries(groups);
  if(!list.length){showErr('Koi valid number nahi mila.');return}
  $('err').innerHTML='';items=[];$('cards').innerHTML='';$('search').value='';
  $('count').textContent=`0 / ${list.length} ho gaye`;

  list.forEach(([num,g],i)=>{
    const cv=draw(g.rows,mci,g.raw,footer,theme);
    const card=document.createElement('div');card.className='box card';card.dataset.num=num;
    const top=document.createElement('div');top.className='top';
    top.innerHTML=`<div class="num">${esc(String(g.raw))}<small>+${num} • ${g.rows.length} order${g.rows.length>1?'s':''}</small></div>`;
    const pill=document.createElement('span');pill.className='pill';pill.textContent='Baaki';top.appendChild(pill);
    const ib=document.createElement('div');ib.className='imgbox';ib.appendChild(cv);
    const b1=document.createElement('button');b1.className='big green';b1.textContent='1️⃣ Image bhejo / save karo';b1.onclick=()=>shareImg(i);
    const b2=document.createElement('button');b2.className='big light';b2.textContent='2️⃣ Is number ki chat kholo';b2.onclick=()=>openChat(i);
    card.append(top,ib,b1,b2);$('cards').appendChild(card);
    items.push({cv,num,card,pill});
  });
  $('out').style.display='block';$('out').scrollIntoView({behavior:'smooth'});
}

function search(q){
  q=q.replace(/\D/g,'');
  document.querySelectorAll('.card').forEach(c=>c.style.display=(!q||c.dataset.num.includes(q))?'block':'none');
}
</script>
</body>
</html>
